services:
  - type: web
    name: touch-grass-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: >-
      pip install -r backend/requirements-render.txt &&
      pip install -r backend/requirements-render-export.txt &&
      python -c "from ultralytics import YOLO; YOLO('yolov8n.pt').export(format='onnx', imgsz=640, dynamic=False, simplify=False)" &&
      pip uninstall -y ultralytics torch torchvision onnx onnxscript onnxslim
    startCommand: PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: touch_grass
      - key: DEMO_MODE
        value: "false"
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: GEMMA_MODEL
        value: gemma3:1b
      - key: YOLO_MODEL
        value: yolov8n.onnx
      - key: GEOCONTEXT_USER_AGENT
        sync: false
